app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:7357,http://127.0.0.1:7357}

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: domaintemplate-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stored_data_domains}
    username: ${SPRING_DATASOURCE_USERNAME:stored_data_domains}
    password: ${SPRING_DATASOURCE_PASSWORD:stored_data_domains}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html